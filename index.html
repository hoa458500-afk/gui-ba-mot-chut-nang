<body>
  <main id="story" class="story" data-scene="0" aria-label="Một lời chào buổi sáng dành cho bà">
    <div class="world" aria-hidden="true"><div class="landscape"></div><div class="dawn"></div><div class="light"></div><div class="veil"></div></div>
    <div class="sakura-glow" aria-hidden="true"></div>
    <canvas id="sakura-back" class="sakura-layer" aria-hidden="true"></canvas>
    <canvas id="sakura-front" class="sakura-layer" aria-hidden="true"></canvas>
    <canvas id="sparkles" aria-hidden="true"></canvas>
    <div class="flash" aria-hidden="true"></div>
    <header class="topbar">
      <span class="dedication"><span aria-hidden="true">✦</span> một chút nắng cho bà</span>
      <button id="sound" class="icon-button sound-button" type="button" aria-label="Tắt âm thanh" aria-pressed="true" title="Bật hoặc tắt âm thanh">
        <svg class="speaker" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="mute-line" d="m15 9 6 6m0-6-6 6"/></svg>
      </button>
    </header>

    <div class="copy-area" aria-live="polite" aria-atomic="true">
      <p id="eyebrow" class="eyebrow">một lời chào bé xíu</p>
      <h1 id="headline">Bà ơi,<br>có nắng gửi tới!</h1>
      <p id="caption" class="caption">Có một bé mèo muốn chào bà buổi sáng.</p>
    </div>

    <div class="character-area">
      <div class="sleepy" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
      <div class="halo" aria-hidden="true"></div>
      <div class="cat-entrance">
        <button id="kitten" class="kitten" type="button" aria-label="Đánh thức bé mèo và mở lời chào buổi sáng" style="--col:0;--row:0">
          <span class="sprite" aria-hidden="true"></span>
        </button>
      </div>
      <div id="bubble" class="bubble" role="status"></div>
      <span class="little-note" aria-hidden="true">đang mơ một giấc thật tròn…</span>
    </div>

    <div class="action-area">
      <button id="main-action" class="main-action" type="button"><span class="button-star" aria-hidden="true">✦</span><span id="action-label">Mở một chút nắng</span><span class="button-star small" aria-hidden="true">✦</span></button>
      <p id="hint" class="hint">Một món quà nhỏ cho buổi sáng của bà.</p>
      <button id="replay" class="text-button" type="button" hidden><span aria-hidden="true">↻</span> Xem lại từ đầu</button>
    </div>

    <footer class="playback" hidden>
      <button id="pause" class="icon-button" type="button" aria-label="Tạm dừng hoạt cảnh"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="pause-icon" d="M8 5v14M16 5v14"/><path class="play-icon" d="m8 5 11 7-11 7V5Z"/></svg></button>
      <div class="progress" role="progressbar" aria-label="Tiến trình lời chào" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span><span></span><span></span><span></span><span></span></div>
      <button id="skip" class="text-button skip" type="button">Xem lời chúc</button>
    </footer>
    <noscript><div class="noscript">Bà ơi, chào buổi sáng! Chúc bà hôm nay gặp toàn chuyện dễ thương. Bật JavaScript để cùng bé mèo mở một chút nắng nha.</div></noscript>
  </main>
